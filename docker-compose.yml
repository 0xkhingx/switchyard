services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: switchyard
      POSTGRES_PASSWORD: switchyard
      POSTGRES_DB: switchyard
    ports:
      # Loopback only: dev credentials must not be reachable from the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: {}
