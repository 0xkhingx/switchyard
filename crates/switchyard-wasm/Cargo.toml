[package]
name = "switchyard-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM wrapper around switchyard-core for the JavaScript SDK"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
switchyard-core = { path = "../switchyard-core" }
wasm-bindgen = "0.2"
serde_json = "1"
