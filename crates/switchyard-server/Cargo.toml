[package]
name = "switchyard-server"
version = "0.1.0"
edition = "2021"

[dependencies]
switchyard-core = { path = "../switchyard-core" }
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
# Runtime-checked queries (sqlx::query, not macros) so builds work offline
# without a live DATABASE_URL; migrate! embeds migrations at compile time.
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid", "chrono"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-service = "0.3"
