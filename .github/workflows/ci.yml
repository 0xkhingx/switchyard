# CI: Rust tests (with live Postgres), WASM build + parity, SDK tests.
# The Rust job runs db_tests::full_flow against the service container, so the
# DB gate ADR-004 requires is checked on every push with nothing installed locally.
name: ci

on:
  push:
  pull_request:

# Least privilege: the jobs only read the repo (artifacts use the job token
# scope that upload/download-artifact need, which contents: read covers).
permissions:
  contents: read

env:
  DATABASE_URL: postgres://switchyard:switchyard@localhost:5432/switchyard

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: switchyard
          POSTGRES_PASSWORD: switchyard
          POSTGRES_DB: switchyard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned by SHA, so the toolchain can't be inferred from the ref name.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm install -g wasm-pack@0.15.0
      - run: wasm-pack build crates/switchyard-wasm --target nodejs --out-dir ../../sdk/js/pkg-nodejs
      - run: wasm-pack build crates/switchyard-wasm --target web --out-dir ../../sdk/js/pkg-web
      - run: node ./sdk/js/parity.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-nodejs
          path: sdk/js/pkg-nodejs/

  sdk:
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-nodejs
          path: sdk/js/pkg-nodejs/
      - run: node --test sdk/js/src/client.test.js
